<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>JARVIS AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <h1>J.A.R.V.I.S.</h1>
            <p>JUST A RATHER VERY INTELLIGENT SYSTEM</p>
        </header>

        <section class="reactor">
            <div class="ring ring-one"></div>
            <div class="ring ring-two"></div>
            <div class="core"></div>
        </section>

        <p id="status">SYSTEM ONLINE</p>

        <section class="conversation">
            <div id="response">
                Good evening, sir.
                JARVIS is ready for your commands.
            </div>
        </section>

        <button id="micButton">
            🎙 ACTIVATE JARVIS
        </button>

        <form id="commandForm">

            <input
                id="commandInput"
                type="text"
                placeholder="Enter your command..."
                autocomplete="off"
            >

            <button type="submit">
                SEND
            </button>

        </form>

        <footer>
            PERSONAL AI ASSISTANT · VERSION 1.0
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
